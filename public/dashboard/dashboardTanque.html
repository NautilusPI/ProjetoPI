                />

              </div>

            <div class="grafico" id="containerGrafico">
              <canvas id="sensorAnalogico"></canvas>
            </div>
          </div>
          <div class="kpisSecundarias">
            <div class="card">
              <div class="topoCard">
                <span>Status do sensor</span>
              </div>
              <div class="numeroCard">
                <span id="cardStatusSensor">--</span>
              </div>
            </div>
            <div class="card">
              <div class="topoCard">
                <span>Modelo do sensor</span>
              </div>
              <div class="numeroCard">
                <span id="cardModeloSensor">--</span>
              </div>
            </div>
            <div class="card">
              <div class="topoCard">
                <span>Data da instalação</span>
              </div>
              <div class="numeroCard">
                <span id="cardInstalacao">--</span>
              </div>
            </div>
            <div class="card">
              <div class="topoCard">
                <span>Capacidade do tanque</span>
              </div>
              <div class="numeroCard">
                <span id="cardCapacidade">--</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>

    function listarDados() {
      var idUsuario = sessionStorage.ID_USUARIO;

      fetch(`/areaUsuario/listarDados/${idUsuario}`)
        .then(function (resposta) {
          if (resposta.ok) {
            resposta.json().then(function (dados) {
              let tanque = dados.tanques;

              let menu = document.getElementById("menu");

              menu.innerHTML = `
                        <option value="./dashboardGeral.html">
                            Visão Geral
                        </option>
                    `;

              for (let i = 0; i < tanque.length; i++) {
                menu.innerHTML += `
                            <option value="./dashboardTanque.html?idTanque=${tanque[i].idTanque}">
                                ${tanque[i].NomeTanque}
                            </option>
                        `;
              }
            });
          } else {
            console.log("Erro ao buscar tanques");
          }
        })
        .catch(function (erro) {
          console.log(erro);
        });
    }

    function irParaPagina() {
      const pagina = document.getElementById("menu").value;

      if (pagina) {
        window.location.href = pagina;
      }
