<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sua dashboard</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/5fcf1c6510.js"
      crossorigin="anonymous"
    ></script>

    <link rel="stylesheet" href="../css/dash.css" />
  </head>

  <body>
    <div class="alert-container" id="alertas">
    </div>
    <div class="navbar">
      <div class="navlink" id="navlink">
        <div class="logo">
          <img src="../assets/Dashboard/logo.png" alt="" />
        </div>
        <a class="link" href="../index.html">Inicio</a>
        <a class="link" href="../calculadora.html">Simulador</a>
      </div>
      <div class="forms">
        <button
          class="preenchido"
          onclick="window.location = '../areaUsuario.html'"
        >
          Espaço do Cliente
        </button>
        <button class="vazado" onclick="deslogar()">Sair</button>
      </div>
    </div>
    <div class="container-externo">
      <div class="container">
        <div class="topo">
          <div class="topoEsquerda">
            <span>Dashboard</span>
            <select id="menu" onchange="irParaPagina()">
            </select>
          </div>
        </div>
        <div class="kpis">
          <div class="card">
            <div class="topoCard">
              <span>Tanques em seu viveiro</span>
              <img src="../assets/Dashboard/tanque-de-agua.png" alt="" />
            </div>
            <div class="numeroCard">
              <span id="kpiTanques"></span>
            </div>
          </div>
          <div class="card">
            <div class="topoCard">
              <span>Tanques sem instalação</span>

              <img src="../assets/Dashboard/sensor-de-temperatura.png" alt="" />
            </div>
            <div class="numeroCard">
              <span id="kpiOffline"></span>
            </div>
         
          </div>
          <div class="card" style="display: none;">
            <div class="topoCard" style="display: none;">
              <span>Tanques fora da faixa ideal</span>
              <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
          </div>
          <div class="card">
            <div class="topoCard">
              <span style="color: #2b8997" id="statusViveiro" 
                >Status do Viveiro</span
              >
              <i 
                class="fa-solid fa-fish-fins"></i>
            </div>
            <div class="numeroCard">
              <span id="kpiStatus"></span>
            </div>
          </div>
        </div>
        <div class="graficos">
          <div class="graficoBarra">
            <div class="topoGraficoBarra">
              <p>Temperatura por tanque</p>
              
            </div>

            <div class="grafico">
              <canvas id="graficoBarra"></canvas>
            </div>
          </div>
          <div class="graficosEtanques">
            <div class="graficoLinha">
              <p>Histórico de alertas por dia</p>
              <div class="grafico"><canvas id="graficoLinha"></canvas></div>
            </div>
            <div class="tanques">
              <p id="qtdTanquesMonitorados"></p>
              <span>Temperatura ideal: 26.0 ºC - 30.0 ºC</span>
              <div id="div_tanqueLista" class="tanquesLista"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
  <script src="../js/dashGeral.js"></script>
  <script>

    let tanqueSelecionado = '';

    function irParaPagina() {
        tanqueSelecionado = document.getElementById("menu").value;
        sessionStorage.TanqueSelecionado = tanqueSelecionado;

        window.location.href = './dashboardTanque.html';
    }
    

    fetch(`/dash/graficoBarra/${idEmpresa}`)
      .then(function (resposta) {
        return resposta.json();
      })

      .then(function (dados) {
        let labels = [];
        let temperaturas = [];

        for (let i = 0; i < dados.length; i++) {
          labels.push(dados[i].NomeTanque);

          temperaturas.push(dados[i].RegistroTemperatura);
        }

        const ctx = document.getElementById("graficoBarra");

        new Chart(ctx, {
          type: "bar",

          data: {
            labels: labels,

            datasets: [
              {
                label: "Temperatura",

                data: temperaturas,

                backgroundColor: "#4DA3B8",

                borderRadius: 4,

                barThickness: 30,
              },

              {
                type: "line",

                data: labels.map(() => 33),

                borderColor: "#E74C3C",

                borderWidth: 2,

                borderDash: [6, 6],

                pointRadius: 0,
              },

              {
                type: "line",

                data: labels.map(() => 30),

                borderColor: "#F39C12",

                borderWidth: 2,

                borderDash: [6, 6],

                pointRadius: 0,
              },

              {
                type: "line",

                data: labels.map(() => 26),

                borderColor: "#F39C12",

                borderWidth: 2,

                borderDash: [6, 6],

                pointRadius: 0,
              },

              {
                type: "line",

                data: labels.map(() => 23),

                borderColor: "#E74C3C",

                borderWidth: 2,

                borderDash: [6, 6],

                pointRadius: 0,
              },
            ],
          },

          options: {
            responsive: true,

            maintainAspectRatio: false,

            plugins: {
              legend: {
                display: false,
              },
              annotation: {
            annotations: {
            faixaIdeal: {
                type: 'box',
                yMin: 26,
                yMax: 30,
                drawTime: 'beforeDatasetsDraw',
                backgroundColor: 'rgba(46, 204, 113, 0.11)',
                borderColor: 'rgba(46, 204, 113, 0.3)',
                borderWidth: 1,
            },
            faixaRisco: {
              type: 'box',
                yMin: 23,
                yMax: 26,
                drawTime: 'beforeDatasetsDraw',
                backgroundColor: 'rgba(204, 178, 46, 0.10)',
                borderColor: 'rgba(204, 201, 46, 0.3)',
                borderWidth: 1,
            },
            faixaCritico: {
              type: 'box',
                yMin: 20,
                yMax: 23,
                drawTime: 'beforeDatasetsDraw',
                backgroundColor: 'rgba(204, 46, 46, 0.10)',
                borderColor: 'rgba(204, 46, 46, 0.3)',
                borderWidth: 1,
            },
            faixaRisco2: {
              type: 'box',
                yMin: 30,
                yMax: 33,
                drawTime: 'beforeDatasetsDraw',
                backgroundColor: 'rgba(204, 178, 46, 0.10)',
                borderColor: 'rgba(204, 201, 46, 0.3)',
                borderWidth: 1,
            },
            faixaCritico2: {
              type: 'box',
                yMin: 33,
                yMax: 40,
                drawTime: 'beforeDatasetsDraw',
                backgroundColor: 'rgba(204, 46, 46, 0.10)',
                borderColor: 'rgba(204, 46, 46, 0.3)',
                borderWidth: 1,
            }
          }
        }
      },

            scales: {
              x: {
                grid: {
                  display: false,
                },
              },

              y: {
                beginAtZero: true,

                min: 20,

                grid: {
                  color: "#eee",
                },
              },
            },
          },
        });
      });

    window.onload = exibirGraficoLinha();

    function exibirGraficoLinha() {
      console.log("Iniciando processo para exibição do gráfico de linha...");
      obterDadosGraficoLinha();
      setInterval(obterDadosGraficoLinha, 7000);
    }

    function obterDadosGraficoLinha() {
      fetch(`/dash/buscarTotalAlertasDia/${idEmpresa}`, { cache: "no-store" })
        .then(function (response) {
          if (response.ok) {
            response.json().then(function (resposta) {
              console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
              
              plotarGraficoLinha(resposta);

            });
          } else {
            console.error("Nenhum dado encontrado ou erro na API");
          }
        })
        .catch(function (error) {
          console.error(
            `Erro na obtenção dos dados p/ gráfico: ${error.message}`,
          );
        });
    }

    function plotarGraficoLinha(resposta) {
      console.log("iniciando plotagem do gráfico...");

      let labels = [];

      let dados = {
        labels: labels,
        datasets: [
          {
            label: "Quantidade de Alertas",
            data: [],
            borderWidth: 2,
            borderColor: "#4DA3B8",
            tension: 0.4,
          },
        ],
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false,
            },
          },
          scales: {
            y: {
              min: 0,
              max: 50,
              ticks: {
                stepSize: 2,
              },
              beginAtZero: true,
              grid: {
                color: "#eee",
              },
            },
          },
        },
      };

      console.log("----------------------------------------------");
      console.log(
        'Estes dados foram recebidos pela funcao "obterDadosGrafico" e passados para "plotarGrafico":',
      );
      console.log(resposta);

      for (i = 0; i < resposta.length; i++) {
        labels.push(resposta[i].date);
        dados.datasets[0].data.push(resposta[i].totalAlertas);
      }

      console.log("----------------------------------------------");
      console.log("O gráfico será plotado com os respectivos valores:");
      console.log("Labels:");
      console.log(labels);
      console.log("Dados:");
      console.log(dados.datasets);
      console.log("----------------------------------------------");

      const config = {
        type: "line",
        data: dados,
      };

      let myChart = new Chart(document.getElementById(`graficoLinha`), config);
    }

  </script>
  <script>

    let Alertas = [];

    function fecharAlerta(i) {
      Alertas.splice(i, 1);
      abrirAlerta();
    }

    function abrirAlerta(){
      alertas.innerHTML = '';

      for (let i = 0; i < Alertas.length; i++) {

      alertas.innerHTML += `
        <div class="alerta">
             <i class="fa-solid fa-circle-exclamation" ></i>
            <div>
                <span class="titulo">Risco na criação</span>
                <span>O ${Alertas[i].tanque} está fora da temperatura ideal(${Alertas[i].registro} °C)</span>
            </div>
            <i class="fa-solid fa-xmark" onclick="fecharAlerta(${i})"></i>
           </div>
        `;
          }
    }


    function carregarMedidasTempoReal() {
      fetch(`/dash/buscarTempoReal/${idEmpresa}`)
        .then((res) => res.json())
        .then((resultado) => {

        document.getElementById(`div_tanqueLista`).innerHTML = '';
        Alertas = [];
        
        console.log(`Dados recebidos: ${JSON.stringify(resultado)}`);

          let tanque = [];
          let registro = [];
          let alerta = [];

          for(i = 0; i < resultado.length; i++){
            tanque.push(resultado[i].NomeTanque);
            registro.push(resultado[i].registroTemperatura);
            alerta.push(resultado[i].descricao);
          } 

          qtdTanquesMonitorados.innerHTML = `Tanques Monitorados (${tanque.length})`
          for (let i = 0; i < tanque.length; i++) {
            let corStatus = "";
            if (alerta[i] == 'Atenção'){
              corStatus = `TanqueAtencao`;
            } else if (alerta[i] == "Crítico") {
              Alertas.push({tanque: tanque[i], registro: registro[i]});
              corStatus = `TanqueRisco`;
            }
            
                document.getElementById(`div_tanqueLista`).innerHTML += `
                                <div class="tanqueCard ${corStatus}">
                                    <div class="borda">
                                    </div>
                                    <div class="conteudo">
                                        <p>${tanque[i]}</p>
                                        <span id="tanque9">${registro[i]}</span>
                                        <span class="statusTanque">${alerta[i]}</span>
                                        </div>
                                        `;
                                      
                    abrirAlerta();
            }

              menu.innerHTML = '<option value="./dashboardGeral.html">Visão Geral</option>';
              for (let i = 0; i < tanque.length; i++) {
              menu.innerHTML += `<option  value="${tanque[i]}">${tanque[i]}</option>`;
              }
            
            });
}

    carregarMedidasTempoReal();
    setInterval(carregarMedidasTempoReal, 3000);

     if(sessionStorage.EMAIL_USUARIO == 'cesar@suporte.com'){
           navlink.innerHTML += `
            <a class="link" href="testeIA.html">Suporte</a>
           
           `

    }
  </script>
</html>
