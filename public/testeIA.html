<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BobIA</title>
    <link rel="stylesheet" href="css/bobIa.css">
</head>
<body>
    <div class="navbar">
    <div class="navlink">
      <div class="logo">
        <img src="./assets/Home/logo.png" alt=""> 
      </div>
        <a class="link" href="index.html">Inicio</a> 
        <a class="link" href="calculadora.html">Simulador</a>
            <a class="link" href="testeIA.html">Suporte</a>

      </div>
      <div class="forms">
    
      </div>
    </div>
    <div id="container">
        <h1>BobIA</h1>
        <textarea id="pergunta" type="text" placeholder="Digite a pergunta..."></textarea>
        <br><br>
        <button onclick="gerarResposta()">Gerar Resposta</button>
        
        <div id="resposta"></div>
    </div>
    <div id="loading">
        <img src="assets/Home/d993b63388e95fb3e0afd500bd2aef52.gif" alt="">
    </div>
    
    <script>
        
         
        async function gerarResposta() {
            loading.style.display = 'flex'
            const pergunta = document.getElementById('pergunta').value;

            const response = await fetch('/perguntar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ pergunta })
            });

            const data = await response.json();

            resposta.style.display = 'block';
            loading.style.display = 'none'

            document.getElementById('resposta').innerText = data.resultado;
        }

    </script>
    
</body>
</html>
