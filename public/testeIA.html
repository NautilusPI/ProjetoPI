<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BobIA</title>
    <link rel="stylesheet" href="css/bobIa.css">
</head>
<body>
    <div class="navbar">
    <div class="navlink">
      <div class="logo">
        <img src="./assets/Home/logo.png" alt=""> 
      </div>
        <a class="link" href="index.html">Inicio</a> 
        <a class="link" href="calculadora.html">Simulador</a>
        <a class="link" href="dashboard/dashboardGeral.html">Dashboard</a>
            <a class="link" href="testeIA.html">Suporte</a>

      </div>
      <div class="forms">
        <button class="vazado"><a href="login.html">Entre</a></button>
        <button class="preenchido"><a href="cadastro.html">Cadastre-se</a> </button>
      </div>
    </div>
    <div id="container">
        <h1>BobIA</h1>
        <textarea id="pergunta" type="text" placeholder="Digite a pergunta..."></textarea>
        <br><br>
        <button onclick="gerarResposta()">Gerar Resposta</button>
        <h3>Resposta da IA:</h3>
        <div id="resposta"></div>
    </div>

    <script>
         resposta.style.display = 'block';
        async function gerarResposta() {
            const pergunta = document.getElementById('pergunta').value;

            const response = await fetch('/perguntar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ pergunta })
            });

            const data = await response.json();

            resposta.style.display = 'block';
            document.getElementById('resposta').innerText = data.resultado;
        }

    </script>
    
</body>
</html>
